services:

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    logging:
      driver: "none"


  kafka-init:
    build: ./kafka

    depends_on:
      - kafka

    logging:
      driver: "none"


  producer:
    build: ./producer

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    restart: unless-stopped

    logging:
      driver: "none"


  metrics-api:
    build: ./metrics-api

    ports:
      - "8000:8000"

    logging:
      driver: "none"


  spark:
    build: ./spark

    user: root

    ports:
      - "4040:4040"

    depends_on:
      kafka-init:
        condition: service_completed_successfully

      producer:
        condition: service_started

      metrics-api:
        condition: service_started

    volumes:
      - ./spark:/opt/spark-apps
      - spark-ivy:/tmp/ivy

    command: /opt/spark/bin/spark-submit --conf spark.jars.ivy=/tmp/ivy --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0 /opt/spark-apps/streaming.py

    logging:
      driver: "none"


volumes:
  spark-ivy: